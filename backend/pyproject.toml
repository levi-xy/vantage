[project]
name = "vantage-backend"
version = "0.0.0"
description = "Vantage backend: integrations, credential store, pollers and API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    # AES-GCM and HKDF for secrets at rest (M1.2).
    "cryptography>=46,<51",
    # Password hashing (M1.3).
    "argon2-cffi>=25.1,<26",
    # Guarded outbound HTTP for integrations (M1.5, core/net_guard.py).
    "httpx>=0.28,<1",
    # Guarded, read-only SNMP for integrations (M1.5). The maintained LeXtudio line.
    "pysnmp>=7.1,<8",
    # Prometheus exposition format for GET /metrics (M2.4, collectors/).
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
# Postgres driver. SQLite needs nothing extra.
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit-style security checks
    "ASYNC",        # async pitfalls
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and obviously fake credentials are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
# pysnmp and pyasn1 ship no type information.
module = ["pysnmp", "pysnmp.*", "pyasn1", "pyasn1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.bandit]
exclude_dirs = ["tests"]
