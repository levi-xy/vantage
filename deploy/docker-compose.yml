name: vantage

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  backend:
    <<: *hardening
    build:
      context: ../backend
      # LICENSE and NOTICE from the repository root (its .dockerignore sends only those).
      additional_contexts:
        license: ..
    # Time for a clean shutdown before SIGKILL: it ends by deleting the backend heartbeat,
    # so restore and key rotation can run at once after `docker compose stop backend`.
    stop_grace_period: 20s
    environment:
      VANTAGE_DATABASE_URL: ${VANTAGE_DATABASE_URL:-sqlite:////data/vantage.db}
      VANTAGE_MASTER_KEY_FILE: /run/secrets/master_key
      VANTAGE_PROMETHEUS_TOKEN_FILE: /run/secrets/prometheus_token
      VANTAGE_COOKIE_SECURE: ${VANTAGE_COOKIE_SECURE:-true}
      VANTAGE_SESSION_MAX_HOURS: ${VANTAGE_SESSION_MAX_HOURS:-12}
      VANTAGE_SESSION_IDLE_MINUTES: ${VANTAGE_SESSION_IDLE_MINUTES:-120}
      # Failed poll cycles in a row before a device is down.
      VANTAGE_DOWN_AFTER_FAILED_CYCLES: ${VANTAGE_DOWN_AFTER_FAILED_CYCLES:-3}
      # The backend's own log lines: DEBUG, INFO, WARNING or ERROR.
      VANTAGE_LOG_LEVEL: ${VANTAGE_LOG_LEVEL:-INFO}
      # Same value as Prometheus' retention below: seeds last_success_at at startup.
      VANTAGE_PROMETHEUS_RETENTION: ${VANTAGE_PROMETHEUS_RETENTION:-30d}
      # Only the bundled nginx (frontend, fixed address below) may name the client.
      VANTAGE_TRUSTED_PROXIES: ${VANTAGE_TRUSTED_PROXIES:-192.168.255.242/32}
      # Host names the dashboard is reached by; empty = any (see .env.example).
      VANTAGE_PUBLIC_HOSTS: ${VANTAGE_PUBLIC_HOSTS:-}
    secrets: [master_key, prometheus_token]
    volumes:
      - backend-data:/data
    tmpfs: [/tmp]
    # ICMP ping (ping_check): lets the non-root backend open unprivileged ICMP datagram
    # sockets, so it needs no NET_RAW capability (cap_drop: ALL stays). The sysctl is
    # per network namespace: it applies to this container only, not the Docker host.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"

  frontend:
    <<: *hardening
    build:
      context: ../frontend
      # LICENSE and NOTICE from the repository root (its .dockerignore sends only those).
      additional_contexts:
        license: ..
    depends_on: [backend]
    # HTTPS (plain HTTP to the same port is redirected), unless VANTAGE_HTTPS=false.
    # VANTAGE_HTTP_PORT is the name used before HTTPS, still honoured so an existing .env
    # keeps its port.
    ports:
      - "${VANTAGE_BIND_ADDRESS:-0.0.0.0}:${VANTAGE_HTTPS_PORT:-${VANTAGE_HTTP_PORT:-8443}}:8443"
    environment:
      VANTAGE_HTTPS: ${VANTAGE_HTTPS:-true}
      VANTAGE_HSTS: ${VANTAGE_HSTS:-false}
    # Certificate and key from deploy/certs/ (read-only; setup.sh creates a self-signed
    # pair when they're missing).
    secrets: [tls_cert, tls_key]
    tmpfs: [/tmp]
    networks:
      default:
        # Fixed so the backend can trust exactly this container (VANTAGE_TRUSTED_PROXIES).
        ipv4_address: 192.168.255.242

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${VANTAGE_PROMETHEUS_RETENTION:-30d}
      # Disk cap: whichever limit is hit first wins; the oldest data goes first.
      - --storage.tsdb.retention.size=${VANTAGE_PROMETHEUS_RETENTION_SIZE:-10GB}
    secrets: [prometheus_token]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # No published port: only the backend talks to Prometheus.

secrets:
  master_key:
    file: ./secrets/master.key
  prometheus_token:
    file: ./secrets/prometheus_token
  tls_cert:
    file: ./certs/tls.crt
  tls_key:
    file: ./certs/tls.key

# A fixed subnet so the frontend's address is known in advance. Other containers get
# addresses from ip_range only, so none of them can take the frontend's address.
# The gateway is pinned too: unpinned, newer Docker versions pick it from ip_range.
# If this range clashes with your LAN, change subnet, ip_range, gateway, the
# frontend's ipv4_address and VANTAGE_TRUSTED_PROXIES together.
# After changing any of them on an existing install (including the upgrade that pinned
# the gateway), run `docker compose down` and then `docker compose up -d`; a plain
# `up -d` reconnects the frontend without its fixed address (see docs/SECURITY.md).
# TODO(maintainer): there is no upgrade-notes section yet; move this note there once
# one exists.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.255.240/28
          ip_range: 192.168.255.248/29
          gateway: 192.168.255.241

volumes:
  backend-data:
  prometheus-data:
