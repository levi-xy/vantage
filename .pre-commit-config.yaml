# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Uses the Prettier pinned in frontend/package.json (run `npm ci` in frontend/ first).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        files: ^frontend/
        types_or: [ts, tsx, javascript, json, css, html, markdown, yaml]
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
