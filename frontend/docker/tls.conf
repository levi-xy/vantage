# Included by /tmp/vantage-nginx/listen.conf when HTTPS is on (the default).
# Certificate and key are mounted read-only as compose secrets from deploy/certs/;
# deploy/setup.sh generates a self-signed pair when the admin hasn't supplied one.
ssl_certificate     /run/secrets/tls_cert;
ssl_certificate_key /run/secrets/tls_key;

# Mozilla "intermediate" profile: TLS 1.2 and 1.3, forward-secret AEAD ciphers only.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Plain HTTP on the HTTPS port: send the browser to the same host and port over HTTPS.
error_page 497 =301 https://$http_host$request_uri;
