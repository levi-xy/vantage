map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    # HTTPS on 8443 by default (TLS settings in docker/tls.conf); plain HTTP sent to the
    # same port is redirected. VANTAGE_HTTPS=false switches to plain HTTP. Written at
    # container start by /docker-entrypoint.d/40-vantage-tls.sh. TLS ends here; the
    # backend speaks plain HTTP on the internal compose network.
    include /tmp/vantage-nginx/listen.conf;
    server_tokens off;

    # Strict-Transport-Security, only when the admin opts in (VANTAGE_HSTS=true). Written
    # at container start by /docker-entrypoint.d/40-vantage-tls.sh; empty otherwise.
    include /tmp/vantage-nginx/hsts.conf;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Only the public API is proxied. /sd/targets and /metrics stay on the
    # internal network, reachable by Prometheus only.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The backend's client address (VANTAGE_TRUSTED_PROXIES). Set, never appended:
        # proxy_set_header replaces any X-Real-IP the client sent with the address nginx
        # itself sees. X-Forwarded-For below is informational and never trusted.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # /healthz: 200, or 503 with one reason code (point an external monitor here).
    # /healthz/live: 200 while the backend runs, whatever else is down.
    location = /healthz {
        proxy_pass http://backend:8000;
        # Overwrite here too, so a client-supplied X-Real-IP never reaches the backend.
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz/live {
        proxy_pass http://backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The map editor's icon library (public/icons/di, fetched at image build). Fixed per
    # image, so cached long. A missing file is a plain 404 (the app shows a generic icon),
    # not the app's index page. add_header in a location replaces the inherited ones, so the
    # security headers are repeated; the CSP keeps a directly opened SVG from running script.
    location /icons/ {
        try_files $uri =404;
        expires 30d;
        include /tmp/vantage-nginx/hsts.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
