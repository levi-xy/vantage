name: Release images

# Publishes the backend and frontend images to GitHub Container Registry, only when a
# version tag (v0.1.0, v0.1.0-rc.1) is pushed. Nothing here runs on pull requests or main.
# Actions are pinned to commit SHAs (the job can push and sign images); the comment names
# the major version each SHA was taken from.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # arm64 builds run under QEMU; a stuck build must not hold the runner for 6 hours.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing (Sigstore OIDC)
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vantage-${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3 (arm64 builds on an amd64 runner)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the full version (0.1.0), major.minor (0.1) for releases only, and "latest"
      # for releases only (a pre-release like 0.1.0-rc.1 gets just its own tag).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image }}
          # LICENSE and NOTICE from the repository root (its .dockerignore sends only those).
          build-contexts: license=.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and build provenance, attached to the image as attestations.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature ties the image digest to this workflow run.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The install files and their checksums, attached to a DRAFT release: the owner reviews
  # the notes and publishes. vantage-deploy-<version>.tar.gz (deploy/ with a compose file
  # that pulls the images just pushed), the same bundle as vantage-deploy.tar.gz, and
  # compose.yml (the standalone compose file with this version's images). The version-free
  # names are what README's /releases/latest/download/ links fetch; GitHub's "latest"
  # skips pre-releases, so those links follow the newest full release only.
  bundle:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the install files
        run: python3 deploy/make_bundle.py "$GITHUB_REF_NAME" dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz compose.yml > SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --draft $prerelease --verify-tag \
            --title "Vantage ${TAG#v}" --generate-notes
