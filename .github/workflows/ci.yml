name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: example-password
          POSTGRES_DB: vantage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the DB tests against Postgres as well as SQLite.
      VANTAGE_TEST_POSTGRES_URL: postgresql://vantage:example-password@localhost:5432/vantage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Lint dev scripts
        run: ruff check --config pyproject.toml ../scripts && ruff format --config pyproject.toml --check ../scripts
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Bandit
        run: bandit -q -c pyproject.toml -r app
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Agent hook tests
        run: node --test "../.claude/hooks/*.test.mjs"
      - name: npm audit
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 6 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  # The standalone compose install (Portainer, Dockge), started from scratch with images
  # built from this checkout: init creates the files, the stack answers /healthz/live.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the images
        run: |
          docker build -t ghcr.io/levi-xy/vantage-backend:0.0.0-ci --build-context license=. backend
          docker build -t ghcr.io/levi-xy/vantage-frontend:0.0.0-ci --build-context license=. frontend
      - name: Write the standalone compose file for these images
        run: python3 deploy/make_bundle.py 0.0.0-ci dist
      - name: Start it from scratch and check it
        run: scripts/standalone_smoke.sh dist/compose.yml

  # An upgrade, the way docs/OPERATIONS.md tells standalone users to do it: the latest final
  # release (its own compose.yml and published images) gets real data through the API, then
  # the stack is redeployed with a compose file for images built from this commit, keeping
  # the volumes. Nothing may be lost, secrets still decrypt, the audit log is intact.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: vantage-upgrade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the images from this commit
        run: |
          docker build -t ghcr.io/levi-xy/vantage-backend:0.0.0-ci --build-context license=. backend
          docker build -t ghcr.io/levi-xy/vantage-frontend:0.0.0-ci --build-context license=. frontend
      - name: Write the compose files (previous release and this build)
        run: |
          mkdir -p upgrade-run
          # /releases/latest is the newest final release (a pre-release is never "latest").
          curl -sSfL --retry 6 --retry-delay 10 --retry-all-errors -o upgrade-run/old.yml \
            https://github.com/levi-xy/vantage/releases/latest/download/compose.yml
          prev=$(sed -n 's/^ *VANTAGE_RELEASE: "\(.*\)"$/\1/p' upgrade-run/old.yml)
          echo "Previous release: ${prev:-unknown}"
          grep -q 'ghcr.io/levi-xy/vantage-backend:' upgrade-run/old.yml
          python3 deploy/make_bundle.py 0.0.0-ci dist
          cp dist/compose.yml upgrade-run/new.yml
      - name: Start the previous release and create data
        run: |
          cd upgrade-run
          docker compose -p "$PROJECT" -f old.yml up -d
          i=0
          until curl -fsk -o /dev/null https://127.0.0.1:8443/healthz/live; do
            i=$((i + 1)); [ "$i" -lt 60 ] || { echo "the old stack didn't start"; exit 1; }
            sleep 3
          done
          code=$(docker compose -p "$PROJECT" -f old.yml exec -T backend \
            python -m app.cli setup-code --quiet | tail -n 1 | tr -d '\r')
          python3 ../scripts/upgrade_check.py seed --setup-code "$code" --state state.json
      - name: Back up, then upgrade the documented way (new compose file, same volumes)
        run: |
          cd upgrade-run
          docker compose -p "$PROJECT" -f old.yml exec -T backend \
            python -m app.cli backup - > backup.json.gz
          [ -s backup.json.gz ] || { echo "the backup is empty"; exit 1; }
          docker compose -p "$PROJECT" -f new.yml up -d --pull never
          docker compose -p "$PROJECT" -f new.yml ps
      - name: Check that nothing was lost
        run: |
          python3 scripts/upgrade_check.py verify --state upgrade-run/state.json --release 0.0.0-ci
      - name: Container logs
        if: failure()
        run: |
          cd upgrade-run
          docker compose -p "$PROJECT" -f new.yml ps -a || true
          docker compose -p "$PROJECT" -f new.yml logs --no-color || true
      - name: Remove the stack
        if: always()
        run: |
          cd upgrade-run
          docker compose -p "$PROJECT" -f new.yml down -v --remove-orphans || true
