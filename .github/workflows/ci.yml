name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: example-password
          POSTGRES_DB: vantage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the DB tests against Postgres as well as SQLite.
      VANTAGE_TEST_POSTGRES_URL: postgresql://vantage:example-password@localhost:5432/vantage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Lint dev scripts
        run: ruff check --config pyproject.toml ../scripts && ruff format --config pyproject.toml --check ../scripts
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Bandit
        run: bandit -q -c pyproject.toml -r app
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Agent hook tests
        run: node --test "../.claude/hooks/*.test.mjs"
      - name: npm audit
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .
