name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: example-password
          POSTGRES_DB: vantage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vantage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the DB tests against Postgres as well as SQLite.
      VANTAGE_TEST_POSTGRES_URL: postgresql://vantage:example-password@localhost:5432/vantage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Lint dev scripts
        run: ruff check --config pyproject.toml ../scripts && ruff format --config pyproject.toml --check ../scripts
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Bandit
        run: bandit -q -c pyproject.toml -r app
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Agent hook tests
        run: node --test "../.claude/hooks/*.test.mjs"
      - name: npm audit
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 6 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  # The standalone compose install (Portainer, Dockge), started from scratch with images
  # built from this checkout: init creates the files, the stack answers /healthz/live.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the images
        run: |
          docker build -t ghcr.io/levi-xy/vantage-backend:0.0.0-ci --build-context license=. backend
          docker build -t ghcr.io/levi-xy/vantage-frontend:0.0.0-ci --build-context license=. frontend
      - name: Write the standalone compose file for these images
        run: python3 deploy/make_bundle.py 0.0.0-ci dist
      - name: Start it from scratch and check it
        run: scripts/standalone_smoke.sh dist/compose.yml

  # The same smoke under Docker user-namespace remapping, as in an unprivileged LXC:
  # root in a container maps to a high host UID. Catches sysctl, GID and volume
  # ownership bugs that the plain runner can't show. Remapping is switched on before
  # the images are built, because the remapped daemon has its own image store.
  standalone-userns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Turn on user-namespace remapping in dockerd
        run: |
          echo '{"userns-remap": "default"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}' | tee /dev/stderr | grep -q 'name=userns' \
            || { echo "userns-remap is not active" >&2; exit 1; }
          grep dockremap /etc/subuid
      - name: Build the images
        run: |
          docker build -t ghcr.io/levi-xy/vantage-backend:0.0.0-ci --build-context license=. backend
          docker build -t ghcr.io/levi-xy/vantage-frontend:0.0.0-ci --build-context license=. frontend
      - name: Write the standalone compose file for these images
        run: python3 deploy/make_bundle.py 0.0.0-ci dist
      - name: Start it from scratch and check it
        run: scripts/standalone_smoke.sh dist/compose.yml
