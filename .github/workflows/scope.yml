name: Contribution scope

# Pull requests from forks may change integrations, cards, presets, their tests and docs, and
# fix bugs in pages and components. This check fails when such a PR touches any file outside
# that allowlist (see CONTRIBUTING.md, "What's in scope"). It runs the base branch's copy of this
# file (pull_request_target), so a PR can't edit the check away. It never checks out or runs
# the PR's code: it only reads the list of changed file names from the API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  scope:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          count=$(wc -l < files.txt)
          if [ "$count" -ge 3000 ]; then
            echo "::error::Too many changed files to check ($count). Split the PR."
            exit 1
          fi
          blocked=0
          while IFS= read -r f; do
            case "$f" in
              # Shared helpers and pages that handle login, secrets, users or the audit log.
              backend/app/integrations/builtin/common.py \
              |frontend/src/components/AuthScreen* \
              |frontend/src/pages/AccountPage*|frontend/src/pages/AuditPage*|frontend/src/pages/auditChanges* \
              |frontend/src/pages/ChannelsPage*|frontend/src/pages/LoginPage*|frontend/src/pages/SetupPage* \
              |frontend/src/pages/TimePage*|frontend/src/pages/UsersPage*|frontend/src/pages/users/* \
              |frontend/src/pages/settings/*) ;;
              # Open to contributors.
              backend/app/integrations/builtin/*|backend/app/integrations/registry.py \
              |backend/tests/integrations/builtin/* \
              |frontend/src/cards/*|frontend/src/pages/*|frontend/src/components/* \
              |docs/integrations/*|docs/exporters/*|docs/INTEGRATIONS.md|docs/OPERATIONS.md|README.md) continue ;;
            esac
            safe=$(printf '%s' "$f" | tr -d '%\r\n')
            echo "::error file=$safe::Outside the scope open to contributors: $safe"
            blocked=1
          done < files.txt
          if [ "$blocked" -ne 0 ]; then
            echo "This PR changes files only the maintainer changes. See CONTRIBUTING.md, \"What's in scope\"."
            echo "If your change needs one of them, say so in the PR description and the maintainer will make it."
            exit 1
          fi
          echo "All changed files are in scope."
